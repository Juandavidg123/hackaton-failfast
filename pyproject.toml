[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-starter-python"
version = "1.0.0"
description = "Simple voice AI assistant built with LiveKit Agents for Python"
requires-python = ">=3.9"

dependencies = [
    "livekit-agents[silero,turn-detector]~=1.3",
    "livekit-plugins-noise-cancellation~=0.2",
    "livekit-plugins-openai~=1.3",
    "python-dotenv",
    "flask~=3.0",
    "flask-cors~=4.0",
    "flask-jwt-extended~=4.6",
    "supabase~=2.0",
    "openai-whisper>=20231117",
    "ollama>=0.1.0",
    "Levenshtein>=0.25.0",
    "hypothesis>=6.0.0",
    "bcrypt>=4.1.0",
    "psycopg2-binary>=2.9.11",
    "httpx>=0.27.0",
    "livekit-plugins-deepgram>=1.3.6",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
